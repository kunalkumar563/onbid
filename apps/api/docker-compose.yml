version: '3.8'

# Local dev dependencies only — the app itself runs with `npm run start:dev`,
# not in this compose file, so hot-reload keeps working normally.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onbid
      POSTGRES_PASSWORD: onbid
      POSTGRES_DB: onbid
    ports:
      - '5432:5432'
    volumes:
      - onbid_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - onbid_redis_data:/data

volumes:
  onbid_postgres_data:
  onbid_redis_data:
